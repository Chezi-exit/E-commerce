<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - eMercado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="./styles.css" rel="stylesheet">
</head>

<body class="login-page">
  <main class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow-lg p-4 login-box">
      <div class="text-center mb-4">
        <i class="bi bi-person-circle" style="font-size:3rem; color:#ff9500;"></i>
        <h2 class="mt-2">Iniciar sesión</h2>
      </div>

      <!--  id agregado -->
      <form id="loginForm" autocomplete="on">
        <div class="mb-3">
          <label for="usuario" class="form-label">Email</label>
          <input id="usuario" type="email" class="form-control" placeholder="ejemplo@mail.com" required />
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input id="password" type="password" class="form-control" placeholder="********" required />
        </div>

        <div class="d-grid">
          <button type="submit" id="btnIngresar" class="btn btn-warning">Ingresar</button>
        </div>

        <div class="d-flex justify-content-between mt-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe">
            <label class="form-check-label" for="rememberMe">Recordarme</label>
          </div>
          <a href="#">¿Olvidaste tu contraseña?</a>
        </div>
      </form>

      <div class="text-center mt-4">
        <p>¿No tienes cuenta? <a href="#" class="text-decoration-none text-primary">Crear cuenta</a></p>
      </div>
    </div>
  </main>
  
  <footer class="text-muted"><div class="container">Este sitio forma parte de JAP</div></footer>
  <div id="spinner-wrapper"><div class="lds-ring"><div></div><div></div><div></div><div></div></div></div>
  <script type="module" src="./js/login.js"></script>
</body>
</html>
